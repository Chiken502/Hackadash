[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Hackadash"
version = "0.1.0"
description = "A dashboard to display Hackatime stats"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
hackadash = "hackadash.main:main"

[tool.setuptools.package-data]
# Include all .tcss files within package directory
"hackadash" = ["*.tcss", "**/*.tcss"]