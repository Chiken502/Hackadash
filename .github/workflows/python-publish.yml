# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Publish Python Package

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org  # Points directly to your PyPI project page

    permissions:
      id-token: write  # MANDATORY: Required for OIDC Trusted Publishing
      contents: read   # Required to check out repository code

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2  # Fixes Node.js warning

    - name: Set up Python
      uses: actions/setup-python@v5.4.0  # Fixes Node.js warning
      with:
        python-version: '3.x'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel build

    - name: Build package distributions
      run: python -m build  # Safely compiles your src/ layout into dist/

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
